<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOM Tree Structure</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    height: 100%;
    overflow: hidden;
}
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f5f5;
    color: #222;
    font-size: 13px;
}
.container {
    width: 100%;
    height: 100vh;
    background: #fff;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}
.toolbar {
    padding: 10px 16px;
    background: #fafafa;
    border-bottom: 1px solid #e0e0e0;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    flex-shrink: 0;
}
.toolbar button {
    padding: 4px 12px;
    border: 1px solid #c0c0c0;
    background: #fff;
    border-radius: 3px;
    cursor: pointer;
    font-size: 12px;
    color: #444;
}
.toolbar button:hover { background: #e8e8e8; }
.toolbar .sep { width: 1px; background: #d0d0d0; height: 20px; margin: 0 4px; }
.toolbar input {
    padding: 4px 10px;
    border: 1px solid #c0c0c0;
    border-radius: 3px;
    font-size: 12px;
    width: 200px;
    outline: none;
}
.toolbar input:focus { border-color: #888; }
.toolbar .count { font-size: 11px; color: #999; margin-left: 4px; }
.table-wrapper {
    flex: 1;
    min-height: 0;
    min-width: 0;
    overflow: scroll;
    position: relative;
    scrollbar-gutter: stable both-edges;
}
table {
    border-collapse: collapse;
    table-layout: fixed;
    width: 100%;
    min-width: 2200px;
}
thead {
    position: sticky;
    top: 0;
    z-index: 10;
}
thead th {
    background: #3a3a3a;
    color: #fff;
    font-weight: 500;
    font-size: 12px;
    padding: 7px 10px;
    text-align: left;
    border-right: 1px solid #555;
    white-space: nowrap;
    position: relative;
    overflow: visible;
}
thead th:last-child { border-right: none; }
thead th .resize-handle {
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    width: 5px;
    cursor: col-resize;
    user-select: none;
    z-index: 2;
}
thead th .resize-handle:hover,
thead th .resize-handle.active {
    background: rgba(255,255,255,0.3);
}
tbody td {
    padding: 3px 10px;
    border-bottom: 1px solid #e8e8e8;
    border-right: 1px solid #e8e8e8;
    vertical-align: middle;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
tbody td:last-child { border-right: none; }
tbody tr:nth-child(even) { background: #f7f7f7; }
tbody tr:nth-child(odd) { background: #fff; }
tbody tr:hover { background: #e8f0fe !important; }
tbody tr.hidden { display: none; }
.tree-cell {
    display: flex;
    align-items: center;
    white-space: nowrap;
    min-height: 20px;
}
.toggle-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 16px;
    cursor: pointer;
    font-size: 10px;
    color: #555;
    flex-shrink: 0;
    border: 1px solid #aaa;
    border-radius: 2px;
    background: #fff;
    line-height: 1;
    user-select: none;
    margin-right: 5px;
}
.toggle-btn:hover { background: #ddd; }
.toggle-btn.leaf { opacity: 0; pointer-events: none; }
.tree-name {
    font-weight: 500;
    white-space: nowrap;
}
.col-lv { width: 150px; }
.col-pc { width: 140px; }
.col-pn { width: 140px; }
.col-rev { width: 50px; }
.col-en { width: 280px; }
.col-cn { width: 180px; }
.col-sv { width: 140px; }
.col-mb { width: 80px; }
.col-type { width: 120px; }
.col-shop { width: 60px; }
.col-swecu { width: 120px; }
.col-uom { width: 50px; }
.col-hwecu { width: 120px; }
.col-usage { width: 760px; min-width: 760px; }
th.col-usage { cursor: col-resize; }
td.col-usage {
    overflow: visible;
    text-overflow: clip;
    white-space: nowrap;
}
td.cell-empty { color: #ccc; }
td.cell-code { font-family: "SF Mono", "Consolas", "Menlo", monospace; font-size: 11px; }
.table-wrapper::-webkit-scrollbar { width: 14px; height: 14px; }
.table-wrapper::-webkit-scrollbar-thumb { background: #b8b8b8; border: 3px solid #f4f4f4; border-radius: 8px; }
.table-wrapper::-webkit-scrollbar-track { background: #f4f4f4; }
.table-wrapper::-webkit-scrollbar-corner { background: #f4f4f4; }
</style>
</head>

 "Make or Buy": "-", "Type": "SW Part", "Shop": "GA", "SW ECU Mark": "BTA3", "UoM": "PC ", "HW ECU Mark": "BTA3", "Usage Code": "(AF00[AF09] OR AF00[AF04] OR AF00[AF05] OR AF00[AF08] OR AF00[AF06] OR AF00[AF07]) AND [AD00{AD01}]"}, "level": 4, "has_children": false}];

var indentWidth = 18;

function esc(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

var parentMap = (function() {
    var pm = new Map();
    var stack = [];
    for (var i = 0; i < items.length; i++) {
        var lv = items[i].level;
        while (stack.length > 0 && stack[stack.length - 1].level >= lv) {
            stack.pop();
        }
        if (stack.length > 0) {
            pm.set(i, stack[stack.length - 1].idx);
        }
        stack.push({idx: i, level: lv});
    }
    return pm;
})();

var childrenMap = new Map();
for (var i = 0; i < items.length; i++) {
    childrenMap.set(i, []);
}
parentMap.forEach(function(parent, child) {
    childrenMap.get(parent).push(child);
});

var expanded = new Set();
for (var i = 0; i < items.length; i++) {
    if (items[i].level <= 1) {
        expanded.add(i);
    }
}

function renderRow(item, idx) {
    var d = item.item;
    var level = item.level;
    var hasChildren = item.has_children;
    var indent = level * indentWidth;

    var cnName = (d['Chinese Part Name'] || '').trim();
    var enName = (d['English Part Name'] || '').trim();
    var displayName = cnName || enName;

    function cell(val, cls) {
        var v = (val || '').trim();
        var c = cls || '';
        var emptyClass = v ? '' : ' cell-empty';
        return '<td class="' + c + emptyClass + '">' + (v ? esc(v) : '&nbsp;') + '</td>';
    }

    var toggleHtml = '';
    if (hasChildren) {
        toggleHtml = '<span class="toggle-btn" data-idx="' + idx + '" onclick="toggleRow(' + idx + ', event)">▶</span>';
    } else {
        toggleHtml = '<span class="toggle-btn leaf">▶</span>';
    }

    var levelHtml = '<div class="tree-cell">';
    levelHtml += '<span style="display:inline-block;width:' + indent + 'px;flex-shrink:0;"></span>';
    levelHtml += toggleHtml;
    levelHtml += '<span class="tree-name">' + esc(d['Level']) + '</span>';
    levelHtml += '</div>';

    return '<tr class="tree-row" data-idx="' + idx + '" data-level="' + level + '" data-has-children="' + hasChildren + '">'
        + '<td class="col-lv">' + levelHtml + '</td>'
        + cell(d['Partition Code'], 'cell-code')
        + cell(d['Part No.'], 'cell-code')
        + '<td class="col-rev">' + (d['Rev'] ? esc(d['Rev']) : '&nbsp;') + '</td>'
        + '<td class="col-en" title="' + esc(enName) + '">' + (enName ? esc(enName) : '&nbsp;') + '</td>'
        + '<td class="col-cn" title="' + esc(cnName) + '">' + (cnName ? esc(cnName) : '&nbsp;') + '</td>'
        + cell(d['SV Partition Code'], 'cell-code')
        + cell(d['Make or Buy'])
        + cell(d['Type'])
        + cell(d['Shop'])
        + cell(d['SW ECU Mark'])
        + cell(d['UoM'])
        + cell(d['HW ECU Mark'])
        + cell(d['Usage Code'], 'col-usage')
        + '</tr>';
}

function render() {
    var tbody = document.getElementById('tbody');
    var html = '';
    for (var i = 0; i < items.length; i++) {
        html += renderRow(items[i], i);
    }
    tbody.innerHTML = html;
    updateVisibility();
    updateToggleIcons();
}

function updateVisibility() {
    var visible = new Set();
    var roots = [];
    for (var i = 0; i < items.length; i++) {
        if (!parentMap.has(i)) roots.push(i);
    }
    function expand(idx) {
        visible.add(idx);
        if (expanded.has(idx)) {
            var children = childrenMap.get(idx) || [];
            for (var c = 0; c < children.length; c++) {
                expand(children[c]);
            }
        }
    }
    for (var r = 0; r < roots.length; r++) {
        expand(roots[r]);
    }

    var rows = document.querySelectorAll('.tree-row');
    for (var i = 0; i < rows.length; i++) {
        var row = rows[i];
        var idx = parseInt(row.dataset.idx);
        if (visible.has(idx)) {
            row.classList.remove('hidden');
        } else {
            row.classList.add('hidden');
        }
    }
}

function updateToggleIcons() {
    var toggles = document.querySelectorAll('.toggle-btn');
    for (var i = 0; i < toggles.length; i++) {
        var btn = toggles[i];
        if (btn.classList.contains('leaf')) {
            btn.style.opacity = '0';
            btn.style.pointerEvents = 'none';
            continue;
        }
        var idx = parseInt(btn.dataset.idx);
        btn.textContent = expanded.has(idx) ? '-▼' : '+▶';
    }
}

function toggleRow(idx, event) {
    event.stopPropagation();
    if (items[idx].has_children) {
        if (expanded.has(idx)) {
            expanded.delete(idx);
        } else {
            expanded.add(idx);
        }
        updateVisibility();
        updateToggleIcons();
    }
}

function expandAll() {
    for (var i = 0; i < items.length; i++) {
        if (items[i].has_children) expanded.add(i);
    }
    updateVisibility();
    updateToggleIcons();
}

function collapseAll() {
    expanded.clear();
    for (var i = 0; i < items.length; i++) {
        if (items[i].level <= 1) expanded.add(i);
    }
    updateVisibility();
    updateToggleIcons();
}

function expandToLevel(lv) {
    expanded.clear();
    for (var i = 0; i < items.length; i++) {
        if (items[i].level < lv && items[i].has_children) {
            expanded.add(i);
        }
        if (items[i].level <= 1) expanded.add(i);
    }
    updateVisibility();
    updateToggleIcons();
}

function doSearch() {
    var query = document.getElementById('search-input').value.trim().toLowerCase();
    document.getElementById('search-count').textContent = '';
    var rows = document.querySelectorAll('.tree-row');
    var count = 0;

    if (!query) {
        for (var i = 0; i < rows.length; i++) {
            rows[i].style.background = '';
        }
        updateVisibility();
        return;
    }

    var matchingSet = new Set();
    for (var i = 0; i < rows.length; i++) {
        var row = rows[i];
        var text = row.textContent.toLowerCase();
        if (text.indexOf(query) !== -1) {
            matchingSet.add(parseInt(row.dataset.idx));
        }
    }

    var toExpand = new Set(expanded);
    matchingSet.forEach(function(idx) {
        var p = parentMap.get(idx);
        while (p !== undefined) {
            toExpand.add(p);
            p = parentMap.get(p);
        }
    });
    expanded.clear();
    toExpand.forEach(function(e) { expanded.add(e); });
    updateVisibility();

    for (var i = 0; i < rows.length; i++) {
        var row = rows[i];
        var idx = parseInt(row.dataset.idx);
        if (matchingSet.has(idx) && !row.classList.contains('hidden')) {
            row.style.background = '#fff3cd';
            count++;
        } else {
            row.style.background = '';
        }
    }

    document.getElementById('search-count').textContent = count > 0 ? '找到 ' + count + ' 条' : '无匹配';
}

// Add resize handles to header cells
(function addResizeHandles() {
    var ths = document.querySelectorAll('thead th');
    for (var i = 0; i < ths.length; i++) {
        var handle = document.createElement('span');
        handle.className = 'resize-handle';
        ths[i].appendChild(handle);
    }
})();

// Column resize
(function initColResize() {
    var startX, startWidth, currentTh, currentCol, handleEl;

    function getColForTh(th) {
        if (!th) return null;
        return document.querySelectorAll('col')[th.cellIndex] || null;
    }

    function px(value) {
        return parseFloat(value) || 0;
    }

    function setColumnWidth(th, width) {
        var col = getColForTh(th);
        th.style.width = width + 'px';
        th.style.minWidth = width + 'px';
        if (col) {
            col.style.width = width + 'px';
            col.style.minWidth = width + 'px';
        }
    }

    function measureTextWidth(text, font) {
        var canvas = measureTextWidth.canvas || (measureTextWidth.canvas = document.createElement('canvas'));
        var ctx = canvas.getContext('2d');
        ctx.font = font;
        return Math.ceil(ctx.measureText(text || '').width);
    }

    function syncUsageWidth() {
        var usageTh = document.querySelector('thead th.col-usage');
        var usageCells = document.querySelectorAll('tbody td.col-usage');
        if (!usageTh) return;

        var font = window.getComputedStyle(usageTh).font;
        var maxWidth = measureTextWidth('Usage Code', font);
        for (var i = 0; i < usageCells.length; i++) {
            var cellFont = window.getComputedStyle(usageCells[i]).font;
            maxWidth = Math.max(maxWidth, measureTextWidth(usageCells[i].textContent, cellFont));
        }

        setColumnWidth(usageTh, Math.max(760, maxWidth + 56, usageTh.offsetWidth));
    }

    function syncTableWidth() {
        syncUsageWidth();
        var table = document.querySelector('table');
        var cols = document.querySelectorAll('col');
        var ths = document.querySelectorAll('thead th');
        var total = 0;
        for (var i = 0; i < ths.length; i++) {
            var colWidth = cols[i] ? px(window.getComputedStyle(cols[i]).width) : 0;
            total += colWidth || ths[i].offsetWidth;
        }
        table.style.width = Math.max(total, 2200) + 'px';
        table.style.minWidth = table.style.width;
    }

    function onMouseDown(e) {
        var th = e.target.closest('th');
        var isHandle = e.target.classList.contains('resize-handle');
        var isUsageHeader = th && th.classList.contains('col-usage');
        if (!isHandle && !isUsageHeader) return;

        e.preventDefault();
        e.stopPropagation();
        syncTableWidth();
        handleEl = isHandle ? e.target : null;
        currentTh = th;
        currentCol = getColForTh(currentTh);
        startX = e.clientX;
        startWidth = currentTh.offsetWidth;
        if (handleEl) handleEl.classList.add('active');
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
    }

    function onMouseMove(e) {
        if (!currentTh) return;
        var diff = e.clientX - startX;
        var newWidth = Math.max(30, startWidth + diff);
        setColumnWidth(currentTh, newWidth);
        syncTableWidth();
    }

    function onMouseUp() {
        if (handleEl) handleEl.classList.remove('active');
        currentTh = null;
        currentCol = null;
        handleEl = null;
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
    }

    document.addEventListener('mousedown', onMouseDown);
    window.addEventListener('load', syncTableWidth);
    window.addEventListener('resize', syncTableWidth);
    window.syncTableWidth = syncTableWidth;
})();

render();
window.syncTableWidth();
</script>
